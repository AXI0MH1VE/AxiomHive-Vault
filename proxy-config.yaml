# DetEnforce Proxy Configuration
# AILock Layer 7 Security Enforcement

# ============================================================================
# PROXY SERVER
# ============================================================================
server:
  listen_port: 8443
  listen_address: "0.0.0.0"
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

# ============================================================================
# BACKEND TARGET
# ============================================================================
backend:
  url: "http://localhost:8080"
  timeout: 30s
  max_idle_conns: 100
  max_conns_per_host: 10
  
# ============================================================================
# RATE LIMITING (DoS Protection)
# ============================================================================
rate_limit:
  enabled: true
  max_requests_per_second: 5
  burst_size: 10
  cleanup_interval: 1m
  
  # Per-IP rate limiting
  per_ip:
    enabled: true
    max_requests_per_second: 10
    burst_size: 20
    
  # Per-user rate limiting (requires authentication)
  per_user:
    enabled: true
    max_requests_per_second: 50
    burst_size: 100

# ============================================================================
# REQUEST VALIDATION
# ============================================================================
validation:
  max_body_size: 1048576  # 1MB
  max_header_size: 8192    # 8KB
  max_url_length: 2048
  
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    - "OPTIONS"
    
  allowed_content_types:
    - "application/json"
    - "application/x-www-form-urlencoded"
    - "multipart/form-data"
    
# ============================================================================
# TLS CONFIGURATION
# ============================================================================
tls:
  enabled: true
  cert_file: "/path/to/cert.pem"
  key_file: "/path/to/key.pem"
  min_version: "1.2"  # 1.0, 1.1, 1.2, 1.3
  
  # Client certificate authentication (mTLS)
  client_auth:
    enabled: false
    ca_file: "/path/to/ca.pem"
    verify_client: false

# ============================================================================
# PATH ALLOWLIST (Deterministic Routing)
# ============================================================================
allowlist:
  enabled: true
  strict_mode: true  # Deny all paths not explicitly allowed
  
  paths:
    # Health and metrics
    - path: "/api/v1/health"
      methods: ["GET"]
      require_auth: false
      
    - path: "/metrics"
      methods: ["GET"]
      require_auth: false
      
    # Authentication endpoints
    - path: "/api/v1/auth/register"
      methods: ["POST"]
      require_auth: false
      
    - path: "/api/v1/auth/login"
      methods: ["POST"]
      require_auth: false
      
    - path: "/api/v1/auth/refresh"
      methods: ["POST"]
      require_auth: true
      
    # Invariant status
    - path: "/api/v1/invariant/status"
      methods: ["GET"]
      require_auth: true
      
    # Policy execution
    - path: "/api/v1/auth/execute"
      methods: ["POST"]
      require_auth: true
      
    # Financial ledger
    - path: "/api/v1/financial/ledger"
      methods: ["GET"]
      require_auth: true
      
    # IWK strategic wealth endpoint (license-gated)
    - path: "/api/v1/strategic/wealth"
      methods: ["POST"]
      require_auth: true
      require_license: true  # IWK_LICENSE_ACTIVE check

# ============================================================================
# AUTHENTICATION
# ============================================================================
auth:
  # JWT validation
  jwt:
    enabled: true
    jwks_endpoint: "https://auth.axiomhive.com/keys"
    jwks_refresh_interval: 1h
    issuer: "ailock-auth"
    audience: "ailock-api"
    
  # API key validation (alternative to JWT)
  api_key:
    enabled: false
    header_name: "X-API-Key"
    
# ============================================================================
# AUDIT LOGGING (POE)
# ============================================================================
audit:
  enabled: true
  
  # Proof of Execution logging
  poe:
    enabled: true
    log_path: "./logs/proxy-poe.log"
    format: "json"
    compliance_id: "OMEGA-7N-RCSM-001"
    
  # Access logs
  access_log:
    enabled: true
    path: "./logs/proxy-access.log"
    format: "json"
    
  # Error logs
  error_log:
    enabled: true
    path: "./logs/proxy-error.log"
    level: "warn"

# ============================================================================
# SECURITY HEADERS
# ============================================================================
security_headers:
  enabled: true
  
  # Standard security headers
  headers:
    X-Frame-Options: "DENY"
    X-Content-Type-Options: "nosniff"
    X-XSS-Protection: "1; mode=block"
    Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    Content-Security-Policy: "default-src 'self'"
    Referrer-Policy: "strict-origin-when-cross-origin"
    Permissions-Policy: "geolocation=(), microphone=(), camera=()"

# ============================================================================
# CORS
# ============================================================================
cors:
  enabled: true
  allowed_origins: ["*"]
  allowed_methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
  allowed_headers: ["Authorization", "Content-Type", "X-Request-ID"]
  exposed_headers: ["X-Request-ID"]
  allow_credentials: true
  max_age: 3600

# ============================================================================
# IP FILTERING
# ============================================================================
ip_filter:
  enabled: false
  
  # Allowlist (if set, only these IPs allowed)
  allowlist: []
    # - "192.168.1.0/24"
    # - "10.0.0.1"
    
  # Blocklist (deny these IPs)
  blocklist: []
    # - "203.0.113.0/24"

# ============================================================================
# ANOMALY DETECTION
# ============================================================================
anomaly_detection:
  enabled: true
  
  # Request pattern analysis
  patterns:
    # Detect rapid repeated requests from same IP
    rapid_requests:
      enabled: true
      threshold: 100  # requests per minute
      window: 1m
      action: "block"  # log, block, or throttle
      
    # Detect suspicious user agents
    suspicious_user_agents:
      enabled: true
      block_empty: true
      block_suspicious: true
      
    # Detect path traversal attempts
    path_traversal:
      enabled: true
      action: "block"
      
# ============================================================================
# CIRCUIT BREAKER
# ============================================================================
circuit_breaker:
  enabled: true
  failure_threshold: 5
  success_threshold: 2
  timeout: 30s
  max_requests: 100

# ============================================================================
# OBSERVABILITY
# ============================================================================
observability:
  metrics:
    enabled: true
    endpoint: "/metrics"
    prometheus: true
    
  tracing:
    enabled: false
    provider: "jaeger"
    endpoint: ""
    sample_rate: 0.1
