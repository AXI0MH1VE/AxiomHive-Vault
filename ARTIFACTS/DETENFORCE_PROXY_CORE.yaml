# Basic proxy configuration example
server:
  listen_address: "0.0.0.0"
  port: 8443
  tls:
    enabled: true
    cert_file: "/home/ubuntu/AILock/server.crt"
    key_file: "/home/ubuntu/AILock/server.key"

upstreams:
  - name: "ailock-api"
    address: "localhost:8080"
    health_check:
      enabled: true
      interval: 30s

security:
  rate_limiting:
    enabled: true
    requests_per_minute: 100
  request_validation:
    enabled: true
    max_body_size: 1048576

logging:
  level: "info"
  format: "json"
  output: "./detenforce-proxy.log"

